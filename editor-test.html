<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editor Test — Suivi de Production</title>
<style>:root{--bg:#f5f5f5;--surface:#ffffff;--text:#2c3e50;--text-secondary:#7f8c8d;--border:#dcdfe6;--primary:#3498db;--primary-dark:#2980b9;--danger:#e74c3c;--success:#27ae60;--warning:#f39c12;--radius:8px;--shadow:0 2px 8px rgba(0,0,0,0.08)}*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}#app{max-width:900px;margin:0 auto;padding:24px 16px}.welcome-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center}.welcome-icon{font-size:64px;margin-bottom:16px}.welcome-screen h1{font-size:2rem;margin-bottom:8px}.welcome-screen p{color:var(--text-secondary);margin-bottom:32px;font-size:1.1rem}.welcome-actions{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}.modal-overlay{display:flex;align-items:center;justify-content:center;min-height:60vh}.modal{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:40px;max-width:480px;text-align:center}.modal-icon{font-size:48px;margin-bottom:12px}.modal h2{margin-bottom:12px}.modal p{color:var(--text-secondary);margin-bottom:8px}.modal-actions{display:flex;gap:12px;justify-content:center;margin-top:24px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border:none;border-radius:var(--radius);font-size:0.95rem;font-weight:500;cursor:pointer;transition:background 0.2s,opacity 0.2s,transform 0.1s}.btn:hover{opacity:0.9;transform:translateY(-1px)}.btn:active{transform:translateY(0)}.btn:disabled{opacity:0.4;cursor:not-allowed;transform:none}.btn-primary{background:var(--primary);color:white}.btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border)}.btn-add{background:var(--success);color:white;font-size:0.9rem;padding:8px 16px}.btn-save{background:var(--primary);color:white}.btn-export{background:#8e44ad;color:white}.btn-import{background:var(--surface);color:var(--text);border:1px solid var(--border)}.btn-delete{background:transparent;border:none;font-size:1.2rem;cursor:pointer;padding:4px 8px;border-radius:4px;transition:background 0.2s}.btn-delete:hover:not(:disabled){background:rgba(231,76,60,0.1)}.btn-delete:disabled{opacity:0.3;cursor:not-allowed}.editor-header{text-align:center;margin-bottom:24px}.editor-header h1{font-size:1.8rem;margin-bottom:4px}.date-info{color:var(--text-secondary);font-size:0.9rem}.field-group{margin-bottom:16px}.field-group label{display:block;font-weight:600;font-size:0.85rem;margin-bottom:4px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px}.field-group input[type="text"],.field-group input[type="number"],.field-group textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:0.95rem;font-family:inherit;transition:border-color 0.2s;background:var(--surface)}.field-group input:focus,.field-group textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(52,152,219,0.15)}.field-group textarea{resize:vertical;min-height:80px}.input-error{border-color:var(--danger) !important;box-shadow:0 0 0 3px rgba(231,76,60,0.15) !important}.field-error{color:var(--danger);font-size:0.8rem;margin-top:4px;min-height:1.2em}.field-titre{background:var(--surface);padding:16px;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px}.scenes-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;margin-top:8px}.scenes-header h2{font-size:1.3rem}.scene-list{display:flex;flex-direction:column;gap:16px;margin-bottom:24px}.scene-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;border-left:4px solid var(--primary);transition:box-shadow 0.2s,transform 0.2s}.scene-card:hover{box-shadow:0 4px 16px rgba(0,0,0,0.12)}.scene-card.dragging{opacity:0.5;transform:scale(0.98)}.scene-card.drag-over{border-left-color:var(--success);box-shadow:0 0 0 2px var(--success)}.scene-card-header{display:flex;align-items:center;margin-bottom:12px}.drag-handle{cursor:grab;font-size:1.2rem;margin-right:8px;color:var(--text-secondary);user-select:none}.drag-handle:active{cursor:grabbing}.scene-number{font-weight:700;font-size:1rem;flex:1}.avancement-row{display:flex;align-items:center;gap:12px}.avancement-row input[type="number"]{width:80px;flex-shrink:0}.progress-bar-mini{flex:1;height:12px;background:#ecf0f1;border-radius:6px;overflow:hidden}.progress-fill{height:100%;border-radius:6px;transition:width 0.3s,background 0.3s}.progress-red{background:#e74c3c}.progress-orange{background:#f39c12}.progress-yellow{background:#f1c40f}.progress-lightgreen{background:#2ecc71}.progress-green{background:#27ae60}.editor-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;padding:20px 0;border-top:1px solid var(--border)}.notification{position:fixed;top:20px;right:20px;padding:12px 20px;border-radius:var(--radius);font-size:0.9rem;font-weight:500;z-index:9999;transform:translateX(120%);transition:transform 0.3s ease;max-width:400px;box-shadow:0 4px 16px rgba(0,0,0,0.15)}.notification-show{transform:translateX(0)}.notification-success{background:#27ae60;color:white}.notification-error{background:#e74c3c;color:white}.notification-info{background:#3498db;color:white}@media (max-width:600px){#app{padding:12px 8px}.editor-header h1{font-size:1.3rem}.welcome-actions{flex-direction:column}.editor-actions{flex-direction:column;align-items:stretch}.avancement-row{flex-wrap:wrap}}</style>
</head>
<body>
<div id="app"></div>
<div id="poster-container" style="display:none;"></div>
<script>
window.html2canvas = function(el, opts) { var c = document.createElement('canvas'); c.width=1200; c.height=800; return Promise.resolve(c); };
function renderPoster() {}
function escapeHTML(s) { var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function validateSpectacle(data) {
var errors = [];
if (!data || typeof data !== 'object' || Array.isArray(data)) {
return { valid: false, errors: ['Le fichier ne contient pas un objet JSON valide.'] };
}
if (typeof data.titre !== 'string' || data.titre.trim() === '') {
errors.push("Le champ 'titre' est manquant ou vide.");
}
if (data.dateModification !== undefined && typeof data.dateModification !== 'string') {
errors.push("Le champ 'dateModification' doit être une chaîne ISO 8601.");
}
if (data.commentaireGlobal !== undefined && typeof data.commentaireGlobal !== 'string') {
errors.push("Le champ 'commentaireGlobal' doit être une chaîne de caractères.");
}
if (!Array.isArray(data.scenes) || data.scenes.length === 0) {
errors.push("Le spectacle doit contenir au moins une scène (tableau 'scenes' non vide).");
} else {
var noms = new Set();
data.scenes.forEach(function(scene, i) {
var prefix = 'Scène n°' + (i + 1);
if (!scene || typeof scene !== 'object') {
errors.push(prefix + ' : n\'est pas un objet valide.');
return;
}
if (typeof scene.nom !== 'string' || scene.nom.trim() === '') {
errors.push(prefix + ' : le champ \'nom\' est manquant ou vide.');
} else {
if (noms.has(scene.nom.trim())) {
errors.push(prefix + ' : le nom \'' + scene.nom + '\' est en doublon.');
}
noms.add(scene.nom.trim());
}
if (typeof scene.avancement !== 'number' || !Number.isInteger(scene.avancement)) {
errors.push(prefix + ' : le champ \'avancement\' doit être un entier.');
} else if (scene.avancement < 0 || scene.avancement > 100) {
errors.push(prefix + ' : l\'avancement (' + scene.avancement + ') doit être entre 0 et 100.');
}
if (scene.todoList !== undefined && typeof scene.todoList !== 'string') {
errors.push(prefix + ' : le champ \'todoList\' doit être une chaîne de caractères.');
}
if (scene.commentaire !== undefined && typeof scene.commentaire !== 'string') {
errors.push(prefix + ' : le champ \'commentaire\' doit être une chaîne de caractères.');
}
});
}
if (errors.length > 0) {
return { valid: false, errors: errors };
}
return { valid: true, data: data };
}
function validateAvancement(value) {
var num = Number(value);
if (value === '' || isNaN(num)) return 'La valeur doit être un nombre entier.';
if (!Number.isInteger(num)) return 'La valeur doit être un entier (pas de décimales).';
if (num < 0 || num > 100) return 'La valeur doit être comprise entre 0 et 100.';
return null;
}
function validateSceneName(name, allNames, currentIndex) {
if (!name || name.trim() === '') return 'Le nom de la scène est obligatoire.';
var trimmed = name.trim();
var duplicate = allNames.some(function(n, i) { return i !== currentIndex && n.trim() === trimmed; });
if (duplicate) return 'Ce nom de scène existe déjà.';
return null;
}
function validateTitre(titre) {
if (!titre || titre.trim() === '') return 'Le titre du spectacle est obligatoire pour la sauvegarde.';
return null;
}
function createEmptySpectacle() {
return {
titre: '',
dateModification: new Date().toISOString(),
commentaireGlobal: '',
scenes: [createEmptyScene()]
};
}
function createEmptyScene() {
return {
nom: '',
avancement: 0,
todoList: '',
commentaire: ''
};
}
function touchDate(state) {
return {
titre: state.titre,
dateModification: new Date().toISOString(),
commentaireGlobal: state.commentaireGlobal,
scenes: state.scenes
};
}
function serializeState(state) {
return {
titre: state.titre,
dateModification: state.dateModification,
commentaireGlobal: state.commentaireGlobal || '',
scenes: state.scenes.map(function(s) {
return {
nom: s.nom,
avancement: s.avancement,
todoList: s.todoList || '',
commentaire: s.commentaire || ''
};
})
};
}
function getProgressColor(avancement) {
if (avancement <= 25) return 'progress-red';
if (avancement <= 50) return 'progress-orange';
if (avancement <= 75) return 'progress-yellow';
if (avancement <= 99) return 'progress-lightgreen';
return 'progress-green';
}
function getProgressHex(avancement) {
if (avancement <= 25) return '#e74c3c';
if (avancement <= 50) return '#f39c12';
if (avancement <= 75) return '#f1c40f';
if (avancement <= 99) return '#2ecc71';
return '#27ae60';
}
var STORAGE_KEY = 'spectacle_cache';
var debounceTimer = null;
function saveToStorage(state) {
try {
localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
} catch (e) {
console.warn('Impossible de sauvegarder dans le localStorage:', e);
}
}
function debouncedSave(state) {
if (debounceTimer) clearTimeout(debounceTimer);
debounceTimer = setTimeout(function() { saveToStorage(state); }, 500);
}
function clearStorage() {
localStorage.removeItem(STORAGE_KEY);
}
function sanitizeFilename(str) {
return str.replace(/[^a-zA-Z0-9\u00C0-\u00FF\- ]/g, '_').replace(/\s+/g, '_');
}
function exportJSON(state) {
var dateStr = state.dateModification
? state.dateModification.slice(0, 10)
: new Date().toISOString().slice(0, 10);
var filename = sanitizeFilename(state.titre) + '_' + dateStr + '.json';
var json = JSON.stringify(state, null, 2);
var blob = new Blob([json], { type: 'application/json' });
var url = URL.createObjectURL(blob);
var a = document.createElement('a');
a.href = url;
a.download = filename;
document.body.appendChild(a);
a.click();
document.body.removeChild(a);
URL.revokeObjectURL(url);
}
function importJSON(file) {
return new Promise(function(resolve) {
if (!file.name.toLowerCase().endsWith('.json')) {
resolve({
valid: false,
errors: ['Format de fichier non supporté. Veuillez sélectionner un fichier .json.']
});
return;
}
var reader = new FileReader();
reader.onload = function(e) {
try {
var data = JSON.parse(e.target.result);
var result = validateSpectacle(data);
resolve(result);
} catch (err) {
resolve({
valid: false,
errors: ['Le fichier ne contient pas du JSON valide : ' + err.message]
});
}
};
reader.onerror = function() {
resolve({ valid: false, errors: ['Erreur de lecture du fichier.'] });
};
reader.readAsText(file);
});
}
function downloadPNG(blob, titre, dateModification) {
var dateStr = dateModification
? dateModification.slice(0, 10)
: new Date().toISOString().slice(0, 10);
var filename = sanitizeFilename(titre) + '_' + dateStr + '.png';
var url = URL.createObjectURL(blob);
var a = document.createElement('a');
a.href = url;
a.download = filename;
document.body.appendChild(a);
a.click();
document.body.removeChild(a);
URL.revokeObjectURL(url);
}
var dragSrcIndex = null;
function renderEditor(container, state, onStateChange) {
container.innerHTML = '';
var header = document.createElement('div');
header.className = 'editor-header';
header.innerHTML =
'<h1>🎭 Tableau de Bord de Production</h1>' +
'<div class="date-info">Dernière modification : ' + formatDate(state.dateModification) + '</div>';
container.appendChild(header);
var titreGroup = createFieldGroup('Titre du spectacle *', 'text', state.titre, function(val) {
state.titre = val;
onStateChange(state);
}, 'titre-input');
titreGroup.classList.add('field-titre');
container.appendChild(titreGroup);
var commentGroup = createTextareaGroup('Commentaire global', state.commentaireGlobal || '', function(val) {
state.commentaireGlobal = val;
onStateChange(state);
}, 'comment-global');
container.appendChild(commentGroup);
var scenesHeader = document.createElement('div');
scenesHeader.className = 'scenes-header';
scenesHeader.innerHTML = '<h2>Scènes</h2>';
var addBtn = document.createElement('button');
addBtn.className = 'btn btn-add';
addBtn.textContent = '+ Ajouter une scène';
addBtn.addEventListener('click', function() {
state.scenes.push(createEmptyScene());
onStateChange(state);
});
scenesHeader.appendChild(addBtn);
container.appendChild(scenesHeader);
var sceneList = document.createElement('div');
sceneList.className = 'scene-list';
sceneList.id = 'scene-list';
state.scenes.forEach(function(scene, index) {
var card = renderSceneCard(scene, index, state, onStateChange);
sceneList.appendChild(card);
});
container.appendChild(sceneList);
var actions = document.createElement('div');
actions.className = 'editor-actions';
actions.innerHTML =
'<button class="btn btn-save" id="btn-save-json">💾 Sauvegarder JSON</button>' +
'<button class="btn btn-export" id="btn-export-png">📸 Exporter PNG</button>' +
'<button class="btn btn-import" id="btn-import-json">📂 Importer JSON</button>' +
'<input type="file" id="file-import" accept=".json" style="display:none">';
container.appendChild(actions);
}
function renderSceneCard(scene, index, state, onStateChange) {
var card = document.createElement('div');
card.className = 'scene-card';
card.setAttribute('draggable', 'true');
card.dataset.index = index;
card.addEventListener('dragstart', function(e) {
dragSrcIndex = index;
card.classList.add('dragging');
e.dataTransfer.effectAllowed = 'move';
});
card.addEventListener('dragend', function() {
card.classList.remove('dragging');
document.querySelectorAll('.scene-card').forEach(function(c) { c.classList.remove('drag-over'); });
});
card.addEventListener('dragover', function(e) {
e.preventDefault();
e.dataTransfer.dropEffect = 'move';
card.classList.add('drag-over');
});
card.addEventListener('dragleave', function() {
card.classList.remove('drag-over');
});
card.addEventListener('drop', function(e) {
e.preventDefault();
card.classList.remove('drag-over');
if (dragSrcIndex !== null && dragSrcIndex !== index) {
var moved = state.scenes.splice(dragSrcIndex, 1)[0];
state.scenes.splice(index, 0, moved);
onStateChange(state);
}
dragSrcIndex = null;
});
var headerDiv = document.createElement('div');
headerDiv.className = 'scene-card-header';
headerDiv.innerHTML = '<span class="drag-handle" title="Glisser pour réordonner">☰</span><span class="scene-number">Scène ' + (index + 1) + '</span>';
var deleteBtn = document.createElement('button');
deleteBtn.className = 'btn btn-delete';
deleteBtn.textContent = '🗑️';
if (state.scenes.length <= 1) {
deleteBtn.disabled = true;
deleteBtn.title = 'Un spectacle doit contenir au moins une scène.';
} else {
deleteBtn.title = 'Supprimer cette scène';
deleteBtn.addEventListener('click', function() {
state.scenes.splice(index, 1);
onStateChange(state);
});
}
headerDiv.appendChild(deleteBtn);
card.appendChild(headerDiv);
var nameGroup = document.createElement('div');
nameGroup.className = 'field-group';
var nameLabel = document.createElement('label');
nameLabel.textContent = 'Nom de la scène *';
var nameInput = document.createElement('input');
nameInput.type = 'text';
nameInput.value = scene.nom;
nameInput.placeholder = 'Ex: Acte 1 — Ouverture';
var nameError = document.createElement('div');
nameError.className = 'field-error';
nameInput.addEventListener('input', function() {
scene.nom = nameInput.value;
var allNames = state.scenes.map(function(s) { return s.nom; });
var err = validateSceneName(nameInput.value, allNames, index);
nameError.textContent = err || '';
nameInput.classList.toggle('input-error', !!err);
if (!err) onStateChange(state);
});
nameGroup.appendChild(nameLabel);
nameGroup.appendChild(nameInput);
nameGroup.appendChild(nameError);
card.appendChild(nameGroup);
var avGroup = document.createElement('div');
avGroup.className = 'field-group field-avancement';
var avLabel = document.createElement('label');
avLabel.textContent = 'Avancement (%)';
var avRow = document.createElement('div');
avRow.className = 'avancement-row';
var avInput = document.createElement('input');
avInput.type = 'number';
avInput.min = '0';
avInput.max = '100';
avInput.step = '1';
avInput.value = scene.avancement;
var avError = document.createElement('div');
avError.className = 'field-error';
var progressBar = document.createElement('div');
progressBar.className = 'progress-bar-mini';
var progressFill = document.createElement('div');
progressFill.className = 'progress-fill ' + getProgressColor(scene.avancement);
progressFill.style.width = scene.avancement + '%';
progressBar.appendChild(progressFill);
avInput.addEventListener('input', function() {
var err = validateAvancement(avInput.value);
avError.textContent = err || '';
avInput.classList.toggle('input-error', !!err);
if (!err) {
scene.avancement = parseInt(avInput.value, 10);
progressFill.style.width = scene.avancement + '%';
progressFill.className = 'progress-fill ' + getProgressColor(scene.avancement);
onStateChange(state);
}
});
avRow.appendChild(avInput);
avRow.appendChild(progressBar);
avGroup.appendChild(avLabel);
avGroup.appendChild(avRow);
avGroup.appendChild(avError);
card.appendChild(avGroup);
var todoGroup = createTextareaGroup('Todo List', scene.todoList || '', function(val) {
scene.todoList = val;
onStateChange(state);
}, 'todo-' + index);
todoGroup.querySelector('textarea').placeholder = '- Point 1\n- Point 2';
card.appendChild(todoGroup);
var commentGroup = createTextareaGroup('Commentaire', scene.commentaire || '', function(val) {
scene.commentaire = val;
onStateChange(state);
}, 'comment-' + index);
card.appendChild(commentGroup);
return card;
}
function createFieldGroup(label, type, value, onChange, id) {
var group = document.createElement('div');
group.className = 'field-group';
var lbl = document.createElement('label');
lbl.textContent = label;
if (id) lbl.htmlFor = id;
var input = document.createElement('input');
input.type = type;
input.value = value || '';
if (id) input.id = id;
input.addEventListener('input', function() { onChange(input.value); });
group.appendChild(lbl);
group.appendChild(input);
return group;
}
function createTextareaGroup(label, value, onChange, id) {
var group = document.createElement('div');
group.className = 'field-group';
var lbl = document.createElement('label');
lbl.textContent = label;
if (id) lbl.htmlFor = id;
var textarea = document.createElement('textarea');
textarea.rows = 3;
textarea.value = value || '';
if (id) textarea.id = id;
textarea.addEventListener('input', function() { onChange(textarea.value); });
group.appendChild(lbl);
group.appendChild(textarea);
return group;
}
function formatDate(isoString) {
if (!isoString) return '—';
var d = new Date(isoString);
return d.toLocaleDateString('fr-FR', {
day: 'numeric', month: 'long', year: 'numeric',
hour: '2-digit', minute: '2-digit'
});
}
function exportPNG(state) {
var posterContainer = document.getElementById('poster-container');
if (!posterContainer) {
posterContainer = document.createElement('div');
posterContainer.id = 'poster-container';
document.body.appendChild(posterContainer);
}
posterContainer.style.position = 'absolute';
posterContainer.style.left = '-9999px';
posterContainer.style.top = '0';
posterContainer.style.width = '1200px';
posterContainer.style.display = 'block';
renderPoster(posterContainer, state);
return new Promise(function(resolve) { setTimeout(resolve, 100); }).then(function() {
return window.html2canvas(posterContainer, {
scale: 2,
useCORS: true,
backgroundColor: '#1a1a2e',
width: 1200,
windowWidth: 1200
});
}).then(function(canvas) {
return new Promise(function(resolve) {
canvas.toBlob(function(blob) {
if (blob) {
downloadPNG(blob, state.titre, state.dateModification);
}
resolve();
}, 'image/png');
});
}).catch(function(err) {
console.error('Erreur lors de l\'export PNG:', err);
alert('Erreur lors de la génération du PNG. Vérifiez la console pour plus de détails.');
}).then(function() {
posterContainer.style.display = 'none';
});
}
var currentState = null;
function startEditor() {
var app = document.getElementById('app');
renderEditor(app, currentState, onStateChange);
bindEditorActions();
}
function onStateChange(newState) {
currentState = touchDate(newState);
debouncedSave(serializeState(currentState));
var app = document.getElementById('app');
renderEditor(app, currentState, onStateChange);
bindEditorActions();
}
function bindEditorActions() {
var saveBtn = document.getElementById('btn-save-json');
var exportBtn = document.getElementById('btn-export-png');
var importBtn = document.getElementById('btn-import-json');
var fileInput = document.getElementById('file-import');
if (saveBtn) {
saveBtn.addEventListener('click', function() {
var err = validateTitre(currentState.titre);
if (err) {
showNotification(err, 'error');
return;
}
currentState = touchDate(currentState);
saveToStorage(serializeState(currentState));
exportJSON(serializeState(currentState));
showNotification('Fichier JSON sauvegardé !', 'success');
});
}
if (exportBtn) {
exportBtn.addEventListener('click', function() {
var err = validateTitre(currentState.titre);
if (err) {
showNotification(err, 'error');
return;
}
showNotification('Génération du PNG en cours...', 'info');
exportPNG(serializeState(currentState)).then(function() {
showNotification('Export PNG terminé !', 'success');
});
});
}
if (importBtn && fileInput) {
importBtn.addEventListener('click', function() { fileInput.click(); });
fileInput.addEventListener('change', function(e) {
var file = e.target.files[0];
if (!file) return;
if (currentState && currentState.titre) {
if (!confirm('L\'import d\'un fichier JSON écrasera les données actuelles. Continuer ?')) {
fileInput.value = '';
return;
}
}
handleImport(file).then(function() {
fileInput.value = '';
});
});
}
}
function handleImport(file) {
return importJSON(file).then(function(result) {
if (!result.valid) {
showNotification('Erreur d\'import : ' + result.errors.join(' | '), 'error');
return;
}
currentState = touchDate(result.data);
saveToStorage(serializeState(currentState));
startEditor();
showNotification('Spectacle importé avec succès !', 'success');
});
}
function showNotification(message, type) {
var notif = document.getElementById('notification');
if (!notif) {
notif = document.createElement('div');
notif.id = 'notification';
